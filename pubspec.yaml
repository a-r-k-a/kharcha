name: kharcha
description: Gamified, offline-first personal finance tracker.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # Material and Cupertino were decoupled from the SDK; go_router 18+ builds
  # its pages with these, so the app must use them too (never
  # package:flutter/material.dart, whose types are distinct).
  material_ui: ^1.9.0
  cupertino_ui: ^1.1.5

  # State, DI, routing
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  go_router: ^18.1.2

  # Auth + cloud sync
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.2.0

  # Local cache (offline-first). hive_ce is the maintained community fork of
  # Hive; we store plain maps so no adapter code generation is needed.
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.2

  # Notifications
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # UI
  fl_chart: ^1.3.0
  flutter_animate: ^4.5.2
  share_plus: ^13.3.1

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/licenses/

  fonts:
    # Display + all monetary numerals. Variable font; weights are applied via
    # FontVariation in AppTypography.
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    # Body copy. Never used for amounts (it has no tabular figures).
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Variable.ttf
    # Micro-labels, metadata, keypad.
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
    # Phosphor icon fonts (MIT), bundled directly: the phosphor_flutter
    # package subclasses IconData, which is final since Flutter 3.47.
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor-Regular.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
